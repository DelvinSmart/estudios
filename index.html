<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de estudios</title>
  <meta name="description" content="Mi carrera de programación, clase por clase, como un mapa.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="web/estilos.css">
  <script>
    // El tema se aplica antes de dibujar, para que no parpadee.
    try { const t = localStorage.getItem('mapa-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="barra">
    <a class="logo" href="#/">
      <span class="prompt">delvin@estudios</span><span class="dos-puntos">:</span><span class="ruta" id="ruta-terminal">~</span><span class="dolar">$</span><span class="cursor"></span>
    </a>
    <div class="barra-acciones">
      <a class="boton-icono" href="#/progreso" title="Mi progreso" aria-label="Mi progreso">💡</a>
      <button class="boton-icono" id="boton-buscar" title="Buscar en todas las clases" aria-label="Buscar">⌕</button>
      <button class="boton-icono" id="boton-tema" title="Cambiar claro / oscuro" aria-label="Cambiar tema">◐</button>
    </div>
  </header>

  <div class="buscador" id="buscador" hidden>
    <div class="buscador-caja">
      <div class="buscador-entrada">
        <span class="mono acento">grep&nbsp;-i</span>
        <input id="entrada-buscar" type="search" placeholder="escribe una palabra: commit, función, agente…" autocomplete="off">
        <button class="boton-icono" id="cerrar-buscar" aria-label="Cerrar">✕</button>
      </div>
      <div id="resultados" class="resultados"></div>
    </div>
  </div>

  <nav class="migas" id="migas" aria-label="Dónde estoy"></nav>
  <main id="app" class="app"><p class="cargando">cargando el mapa…</p></main>

  <footer class="pie mono">
    <span>// hecho con HTML, CSS y JavaScript</span>
    <span>// el texto sale de los LECCION.md</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="web/app.js"></script>
</body>
</html>
