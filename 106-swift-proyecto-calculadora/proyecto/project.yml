# El proyecto de Xcode, escrito como texto (XcodeGen lo convierte en Calculadora.xcodeproj): xcodegen generate
name: Calculadora
options:
  bundleIdPrefix: com.tuusuario
  deploymentTarget:
    iOS: "18.0"
targets:
  Calculadora:
    type: application
    platform: iOS
    sources: [Calculadora]
    settings:
      base:
        # Distinto de la de React Native (com.tuusuario.calculadora) y de la de Kotlin: la lección de la clase 96.
        PRODUCT_BUNDLE_IDENTIFIER: com.tuusuario.calculadoraswift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Calculadora Swift
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
  PruebasCalculadora:
    type: bundle.unit-test
    platform: iOS
    sources: [PruebasCalculadora]
    dependencies:
      - target: Calculadora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  Calculadora:
    build:
      targets:
        Calculadora: all
    test:
      targets: [PruebasCalculadora]
