<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Panel · Mapa de estudios</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="web/estilos.css">
  <link rel="stylesheet" href="web/panel.css">
  <script>
    // El tema se aplica antes de dibujar, para que no parpadee (el mismo que la página de estudios).
    try { const t = localStorage.getItem('mapa-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="barra">
    <a class="logo" href="#/">
      <span class="prompt">delvin@panel</span><span class="dos-puntos">:</span><span class="ruta" id="ruta-terminal">~</span><span class="dolar">$</span><span class="cursor"></span>
    </a>
    <div class="barra-acciones">
      <a class="boton-icono" href="./" title="Ver la página de estudios" aria-label="Ver la página de estudios">🗺️</a>
      <button class="boton-icono" id="boton-salir" type="button" title="Salir (borra la llave de este aparato)" aria-label="Salir" hidden>⏏</button>
    </div>
  </header>

  <main id="app" class="app"><p class="cargando">cargando el panel…</p></main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script type="module" src="web/panel.js"></script>
</body>
</html>
