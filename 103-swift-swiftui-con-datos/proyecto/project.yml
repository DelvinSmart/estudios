# El proyecto de Xcode, escrito como texto (XcodeGen lo convierte en MiJornada.xcodeproj).
# No hace falta para seguir la clase: el .xcodeproj ya está. Sirve para rehacerlo: xcodegen generate
name: MiJornada
options:
  bundleIdPrefix: com.tuusuario
  deploymentTarget:
    iOS: "18.0"
targets:
  MiJornada:
    type: application
    platform: iOS
    sources: [MiJornada]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuusuario.mijornada
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mi jornada
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
